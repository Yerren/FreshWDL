apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-freshwdl
  labels:
    app.kubernetes.io/name: freshwdl
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/part-of: memory-safe-meteorology
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: freshwdl
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        app.kubernetes.io/name: freshwdl
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- toYaml .Values.podLabels | nindent 8 }}
    spec:
      containers:
        - name: freshwdl
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /FreshWDL.html
              port: http
            initialDelaySeconds: 5   # matches the minimum loading time (ADR-0010)
          readinessProbe:
            httpGet:
              path: /FreshWDL.html
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.clientraw.existingClaim }}
          volumeMounts:
            - name: clientraw
              mountPath: {{ .Values.clientraw.mountPath }}/clientraw
              readOnly: true
          {{- end }}
      {{- if .Values.clientraw.existingClaim }}
      volumes:
        - name: clientraw
          persistentVolumeClaim:
            claimName: {{ .Values.clientraw.existingClaim }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
