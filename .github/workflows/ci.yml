# 🦀 FreshWDL-rs Continuous Integration
#
# Validates the weather across 3 operating systems × 4 Rust versions × 18 languages
# = 216 jobs, for maximum confidence in a static HTML page.
#
# (The matrix jobs are intentionally lightweight. The real build happens in the
# `build-the-weather` job below.)

name: "🦀 CI: Memory-Safe Meteorology"

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 🌍 The Matrix (216 jobs)
  # ───────────────────────────────────────────────────────────────────────────
  validate-weather:
    name: "🌦️ Validate weather (${{ matrix.lang }}, ${{ matrix.os }}, rust ${{ matrix.rust }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly, "1.75.0"]
        lang: [en, nl, da, ro, fr, gr, it, es, nb, bg, cs, fi, si, de, pt, sv, ca, hr]
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🦀 Validate weather"
        shell: bash
        run: |
          echo "🦀 Validating weather for ${{ matrix.lang }} on ${{ matrix.os }} with rust ${{ matrix.rust }}"
          echo "🦀 cargo is not installed in this job, but its spirit is"
          echo "✅ The weather is valid."

      - name: "📊 Respect the barometer"
        shell: bash
        run: echo "📊 Barometer respected (${{ matrix.lang }})"

      - name: "🧭 Confirm wind direction citizenship"
        shell: bash
        run: echo "🧭 Wind direction remains a first-class citizen (ADR-0004)"

  # ───────────────────────────────────────────────────────────────────────────
  # 🏗️ The Real Build
  # ───────────────────────────────────────────────────────────────────────────
  build-the-weather:
    name: "🏗️ Build the weather (cargo test + wasm)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🦀 Install Rust (stable) + wasm32 target"
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: "🧪 cargo test --workspace"
        run: cargo test --workspace

      - name: "🚀 Build WebAssembly (blazingly)"
        run: cargo build -p freshwdl-wasm --target wasm32-unknown-unknown --release

      - name: "📏 Report WASM size"
        run: ls -la target/wasm32-unknown-unknown/release/*.wasm

  # ───────────────────────────────────────────────────────────────────────────
  # ☸️ Kubernetes-Native Weather (ADR-0016)
  # Spins up a real Kubernetes cluster, installs the chart, and checks that
  # `kubectl get weather` reports the weather from a test clientraw.txt.
  # ───────────────────────────────────────────────────────────────────────────
  kubernetes-weather:
    name: "☸️ kubectl get weather (kind)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☸️ Create a cluster to hold the weather"
        uses: helm/kind-action@v1
        with:
          cluster_name: freshwdl-weather

      - name: "🐳 Build images"
        run: |
          docker build -f Dockerfile.operator -t freshwdl-operator:2.0.0-rs .
          docker build -f Dockerfile -t freshwdl-rs:2.0.0-rs .
          kind load docker-image --name freshwdl-weather freshwdl-operator:2.0.0-rs freshwdl-rs:2.0.0-rs

      - name: "📡 Start a pretend weather station"
        run: |
          mkdir -p /tmp/station
          cp crates/freshwdl-wasm/tests/fixtures/clientraw.txt /tmp/station/
          (cd /tmp/station && nohup python3 -m http.server 8766 --bind 0.0.0.0 >/tmp/station.log 2>&1 &)
          echo "GATEWAY=$(docker network inspect kind -f '{{range .IPAM.Config}}{{.Gateway}} {{end}}' | tr ' ' '\n' | grep -E '^[0-9]+\.' | head -1)" >> "$GITHUB_ENV"

      - name: "⎈ helm install"
        run: |
          helm upgrade --install freshwdl ./helm/freshwdl \
            --namespace weather --create-namespace \
            --set weather.clientrawUrl="http://${GATEWAY}:8766/clientraw.txt" \
            --set weather.refreshSeconds=10 \
            --set resources.requests.cpu=10m --set resources.requests.memory=16Mi \
            --wait --timeout 180s

      - name: "🌡️ kubectl get weather"
        run: |
          for i in $(seq 1 30); do
            T=$(kubectl -n weather get weather outside -o jsonpath='{.status.temperature}' || true)
            [ -n "$T" ] && break
            sleep 2
          done
          kubectl -n weather get weather -o wide
          test "$(kubectl -n weather get weather outside -o jsonpath='{.status.temperature}')" = "14.3°C"
          echo "✅ The weather has been reconciled. 🦀"

  # ───────────────────────────────────────────────────────────────────────────
  # 🌧️ Is it raining?
  # ───────────────────────────────────────────────────────────────────────────
  is-it-raining:
    name: "Check if it's raining"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: "☔ Look outside"
        run: |
          echo "☔ Checking if it's raining..."
          echo "🪟 There is no window in a GitHub Actions runner."
          echo "✅ Assuming it is not raining indoors (it_should_not_rain_indoors)."

  # ───────────────────────────────────────────────────────────────────────────
  # 🦀 Ferris
  # ───────────────────────────────────────────────────────────────────────────
  greet-ferris:
    name: "🦀 Greet Ferris"
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: "👋 Hello Ferris"
        run: |
          echo '    _~^~^~_'
          echo '\) /  o o  \ (/'
          echo "  '_   -   _'"
          echo "  / '-----' \\"
          echo "🦀 Hello, Ferris."

  # ───────────────────────────────────────────────────────────────────────────
  # ✅ Summary
  # ───────────────────────────────────────────────────────────────────────────
  all-green:
    name: "✅ All 216 weathers validated"
    runs-on: ubuntu-latest
    needs: [validate-weather, build-the-weather, kubernetes-weather, is-it-raining, greet-ferris]
    steps:
      - run: echo "🎉 The weather is memory safe. Ship it. 🚀"
