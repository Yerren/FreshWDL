<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="css/stylesheet01.css" />
        <link href="css/opentip.min.css" rel="stylesheet" type="text/css" />
        <meta http-equiv="Content-Script-Type" content="javascript" />
        <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
        <title>FreshWDL (OO)</title>

        <!-- Modals (shared across layouts). The layout itself is loaded at
             end of body, after widget classes — see Layout.js. -->
        <script type="text/javascript" src="Modals.js"></script>
    </head>
    <body onload="app.start();">
        <!-- Loading Screen -->
        <div id="loadingScreen">
            <div id="loadingText">
                <p id="titleText">Golden Bay Weather</p>
                <p id="loadingMessage">Collecting Data.</p>
            </div>
        </div>

        <script type="text/javascript" src="js_bundles/Loading.js"></script>

        <!-- Config + vendor libraries -->
        <script type="text/javascript" src="config.js"></script>
        <script type="text/javascript" src="js_bundles/easeljs-0.8.2.min.js"></script>
        <script type="text/javascript" src="js_bundles/tweenjs-0.6.2.min.js"></script>
        <script type="text/javascript" src="js_bundles/opentip-native.min.js"></script>
        <script type="text/javascript" src="js_bundles/moment-with-locales.min.js"></script>
        <script type="text/javascript" src="js_bundles/Chart.min.js"></script>
        <script type="text/javascript" src="js_bundles/Globals.js"></script>

        <!-- Data-processing helpers (Number/Array prototypes, getExtraInput,
             processGraphData, processRecordsData, formatTimestampsToMoments). -->
        <script type="text/javascript" src="js_bundles/DataHelpers.js"></script>

        <!-- Declarative data binding resolver. Must load before WidgetBase. -->
        <script type="text/javascript" src="js_bundles/DataBindings.js"></script>

        <!-- OO base hierarchy -->
        <script type="text/javascript" src="js_bundles/WidgetBase.js"></script>
        <script type="text/javascript" src="js_bundles/CanvasWidget.js"></script>
        <script type="text/javascript" src="js_bundles/DomHandler.js"></script>

        <!-- OO shape specialisations -->
        <script type="text/javascript" src="js_bundles/WidgetText.js"></script>
        <script type="text/javascript" src="js_bundles/WidgetBar.js"></script>
        <script type="text/javascript" src="js_bundles/WidgetGauge.js"></script>
        <script type="text/javascript" src="js_bundles/WidgetChart.js"></script>

        <!-- OO concrete widgets -->
        <script type="text/javascript" src="js_bundles/widgets/ApparentWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/SolarBarWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/HumidityGaugeWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/MainChartWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/TemperatureBarWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/BarometerWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/MoonSunWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/StatusWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/TitleRainfallWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/UniBarWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/UVBarWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/WindGaugeWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/WindSpeedWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/WindSpeedGaugeWidget.js"></script>

        <!-- OO DOM handlers -->
        <script type="text/javascript" src="js_bundles/handlers/ForecastHandler.js"></script>
        <script type="text/javascript" src="js_bundles/handlers/RecordsHandler.js"></script>
        <script type="text/javascript" src="js_bundles/handlers/ModalGraphHandler.js"></script>
        <script type="text/javascript" src="js_bundles/handlers/ButtonsHandler.js"></script>
        <script type="text/javascript" src="js_bundles/handlers/ModalHandler.js"></script>

        <!-- OO infrastructure -->
        <script type="text/javascript" src="js_bundles/WidgetRegistry.js"></script>
        <script type="text/javascript" src="js_bundles/WidgetFactory.js"></script>
        <script type="text/javascript" src="js_bundles/DataManager.js"></script>
        <script type="text/javascript" src="js_bundles/LayoutMount.js"></script>
        <script type="text/javascript" src="js_bundles/App.js"></script>

        <!-- Layout + manifest. Writes the page DOM and constructs window.app.
             Swap this single file to try a different layout. Body onload
             calls app.start(). -->
        <script type="text/javascript" src="Layout.js"></script>

        <a title="Web Statistics" href="http://clicky.com/100669726"><img alt="Web Statistics" src="//static.getclicky.com/media/links/badge.gif" border="0"></a>
        <script src="//static.getclicky.com/js" type="text/javascript"></script>
        <script type="text/javascript">try{ clicky.init(100669726); }catch(e){}</script>
        <noscript><p><img alt="Clicky" width="1" height="1" src="//in.getclicky.com/100669726ns.gif" /></p></noscript>
    </body>
</html>
