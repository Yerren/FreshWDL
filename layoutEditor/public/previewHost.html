<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>FreshWDL Preview</title>
  <link rel="stylesheet" type="text/css" href="/runtime/css/stylesheet01.css" />
  <link rel="stylesheet" type="text/css" href="/runtime/css/opentip.min.css" />
  <style>
    html, body { background: #fff; margin: 0; }
    /* Hide loading screen ASAP — we drive the preview manually. */
    #loadingScreen { display: none !important; }
  </style>

  <script src="/runtime/Modals.js"></script>
</head>
<body>
  <div id="loadingScreen"><div id="loadingText">
    <p id="titleText">Preview</p><p id="loadingMessage">Loading…</p>
  </div></div>

  <script src="/runtime/js_bundles/Loading.js"></script>

  <!-- Use a local config that points at /runtime/sample/ for clientraw URLs.
       The parent frame can override window.PREVIEW_DATA_URL_PREFIX before
       calling renderLayout(). -->
  <script>
    // Expose a hook so the parent frame can re-render without reloading.
    window.__previewHost = {
      renderLayout: null, // assigned below
      pendingDoc: null,
    };
  </script>
  <script src="/runtime/config.js"></script>
  <script src="/runtime/js_bundles/easeljs-0.8.2.min.js"></script>
  <script src="/runtime/js_bundles/tweenjs-0.6.2.min.js"></script>
  <script src="/runtime/js_bundles/opentip-native.min.js"></script>
  <script src="/runtime/js_bundles/moment-with-locales.min.js"></script>
  <script src="/runtime/js_bundles/Chart.min.js"></script>
  <script src="/runtime/js_bundles/Globals.js"></script>
  <script src="/runtime/js_bundles/DataHelpers.js"></script>
  <script src="/runtime/js_bundles/DataBindings.js"></script>
  <script src="/runtime/js_bundles/WidgetBase.js"></script>
  <script src="/runtime/js_bundles/CanvasWidget.js"></script>
  <script src="/runtime/js_bundles/DomHandler.js"></script>
  <script src="/runtime/js_bundles/WidgetText.js"></script>
  <script src="/runtime/js_bundles/WidgetBar.js"></script>
  <script src="/runtime/js_bundles/WidgetGauge.js"></script>
  <script src="/runtime/js_bundles/WidgetChart.js"></script>
  <script src="/runtime/js_bundles/widgets/ApparentWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/SolarBarWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/HumidityGaugeWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/MainChartWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/TemperatureBarWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/BarometerWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/MoonSunWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/StatusWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/TitleRainfallWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/UniBarWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/UVBarWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/WindGaugeWidget.js"></script>
  <script src="/runtime/js_bundles/widgets/WindSpeedWidget.js"></script>
  <script src="/runtime/js_bundles/handlers/ForecastHandler.js"></script>
  <script src="/runtime/js_bundles/handlers/RecordsHandler.js"></script>
  <script src="/runtime/js_bundles/handlers/ModalGraphHandler.js"></script>
  <script src="/runtime/js_bundles/handlers/ButtonsHandler.js"></script>
  <script src="/runtime/js_bundles/handlers/ModalHandler.js"></script>
  <script src="/runtime/js_bundles/WidgetRegistry.js"></script>
  <script src="/runtime/js_bundles/WidgetFactory.js"></script>
  <script src="/runtime/js_bundles/DataManager.js"></script>
  <script src="/runtime/js_bundles/LayoutMount.js"></script>
  <script src="/runtime/js_bundles/App.js"></script>

  <script>
    // Render-driver. The parent frame posts {type:"render", layoutJsSource}
    // and we eval it. The Layout.js source is a regular script that calls
    // document.write() (capturing markup into our placeholder) and constructs
    // window.app, after which we call app.start().
    (function () {
      var container = null;

      function applyOverlayModeStyles(on) {
        var id = "overlayModeStyles";
        var existing = document.getElementById(id);
        if (existing) existing.remove();
        if (!on) return;
        var s = document.createElement("style");
        s.id = id;
        // In overlay mode the iframe is sized to the editor's grid-host
        // (already 16:9), so we override the runtime's default sizing to fill
        // the iframe exactly, and hide the bottom button bar / version label
        // since the editor's bounding boxes only span the widget grid.
        s.textContent =
          "html, body { height: 100%; margin: 0; background: transparent !important; }" +
          "#FWDLcontainer { width: 100% !important; height: 100% !important;" +
          "  aspect-ratio: auto !important; margin: 0 !important; }" +
          "#bottom, #Version { display: none !important; }";
        document.head.appendChild(s);
      }

      function applyLayout(layoutJsSource) {
        // Point the runtime at our chosen clientraw source. config.js declares
        // customBaseURL as a `var`, so we just reassign on globalThis.
        if (typeof window.PREVIEW_DATA_URL_PREFIX === "string") {
          window.customBaseURL = window.PREVIEW_DATA_URL_PREFIX;
        } else {
          window.customBaseURL = "/runtime/";
        }

        // Tear down previous app if any.
        try { if (window.app && window.app.stop) window.app.stop(); } catch (e) {}
        try { if (window.app && window.app.destroy) window.app.destroy(); } catch (e) {}

        // Reset data-update bookkeeping so the next fetch dispatches the
        // clientRaw*DataUpdate events the freshly-built widgets listen for.
        // Without this, a rebuild (e.g. after a resize or live edit) finds
        // arrayClientrawOld already equal to the cached arrayClientraw, marks
        // it unchanged, and the new widgets never receive their first update —
        // gauges and graphs stay at zero until the next iframe is mounted.
        window.arrayClientraw = [];
        window.arrayClientrawExtra = [];
        window.arrayClientrawHour = [];
        window.arrayClientrawDaily = [];
        window.arrayClientrawOld = [];
        window.arrayClientrawExtraOld = [];
        window.arrayClientrawHourOld = [];
        window.arrayClientrawDailyOld = [];
        window.firstTime = true;
        window.loaded = null;
        window.doneCR = window.doneCRE = window.doneCRH = window.doneCRD = false;
        window.attemptedCR = window.attemptedCRE = window.attemptedCRH = window.attemptedCRD = false;

        // Replace any existing FWDLcontainer + bottom buttons.
        var prev = document.getElementById("FWDLcontainer");
        if (prev) prev.remove();
        var prevBottom = document.getElementById("bottom");
        if (prevBottom) prevBottom.remove();
        var prevVer = document.getElementById("Version");
        if (prevVer) prevVer.remove();

        // Override document.write so the layout markup goes into a known place
        // rather than appending to body wherever the script lives.
        var bufferedHTML = "";
        var origWrite = document.write;
        document.write = function (s) { bufferedHTML += s; };

        try {
          // eslint-disable-next-line no-eval
          (0, eval)(layoutJsSource);
        } finally {
          document.write = origWrite;
        }

        var holder = document.createElement("div");
        holder.innerHTML = bufferedHTML;
        // Move children to body (preserving order).
        while (holder.firstChild) document.body.appendChild(holder.firstChild);

        // Ensure every manifest enabledKey has a widgetList entry. Editor-
        // created widgets may use keys the stock Globals.js doesn't know.
        try {
          var manifest = (window.app && window.app.manifest) || [];
          for (var i = 0; i < manifest.length; i++) {
            var k = manifest[i].enabledKey;
            if (k && typeof window.widgetList === "object" && !window.widgetList[k]) {
              window.widgetList[k] = { enabled: true };
            }
          }
        } catch (e) {}

        // Neutralise the legacy fixed-aspect-ratio sizing helpers from
        // Globals.js — they assume the original 16:9 layout and stamp
        // explicit pixel width/height on #FWDLcontainer that fight the grid
        // CSS our codegen emits. The grid container is responsive on its own.
        window.initialiseLayout = function () {
          var v = document.getElementById("Version");
          if (v) { v.innerHTML = "FreshWDL Preview"; }
        };
        window.resizeContainer = function () {};

        if (window.app && typeof window.app.start === "function") {
          try { window.app.start(); } catch (e) { console.error("preview app.start failed", e); }
        }

        // Diagnostic: log each widget's canvas size after start. If a slot
        // ended up with 0×0, the widget will be invisible — surfaces that
        // immediately rather than leaving a silent blank canvas.
        try {
          setTimeout(function () {
            var slots = document.querySelectorAll("[data-widget]");
            slots.forEach(function (s) {
              var c = s.querySelector("canvas");
              if (c) {
                console.log("[preview] " + s.getAttribute("data-widget") +
                  " slot=" + s.clientWidth + "x" + s.clientHeight +
                  " canvas=" + c.width + "x" + c.height);
              } else {
                console.warn("[preview] " + s.getAttribute("data-widget") + " has no canvas");
              }
            });
          }, 200);
        } catch (e) {}
      }

      window.__previewHost.renderLayout = applyLayout;

      // Soft-update keeps existing canvases mounted; ResizeObserver picks up
      // slot resizes, so widgets reflow without re-init or animation reset.
      function applySlotPlacement(el, s) {
        if (!el || !s) { return; }
        el.style.gridColumn = s.colStart + " / " + s.colEnd;
        el.style.gridRow = s.rowStart + " / " + s.rowEnd;
      }

      function softRemove(id) {
        var app = window.app;
        if (!app) { return; }
        var el = document.querySelector('[data-widget="' + id + '"]');
        if (app.layoutMount && el) { app.layoutMount.unobservePlaceholder(el); }
        if (app.registry) { app.registry.unregister(id); }
        if (app.factory) { app.factory.removeEntry(id); }
        if (el && el.parentNode) { el.parentNode.removeChild(el); }
      }

      function softAdd(addSpec, slotPlacement) {
        var app = window.app;
        if (!app) { return; }
        var entry;
        try {
          // (0, eval) forces expression context (eval'd object literal needs parens)
          // and runs in the iframe's global scope so constructors resolve by name.
          // eslint-disable-next-line no-eval
          entry = (0, eval)("(" + addSpec.entrySource + ")");
        } catch (err) {
          console.error("softAdd: failed to eval manifest entry for " + addSpec.instanceId, err);
          return;
        }
        if (!entry || !entry.Ctor) { return; }

        if (entry.enabledKey && typeof window.widgetList === "object" &&
                !window.widgetList[entry.enabledKey]) {
          window.widgetList[entry.enabledKey] = { enabled: true };
        }

        var slot = null;
        if (addSpec.placed) {
          var container = document.getElementById("FWDLcontainer");
          if (!container) { return; }
          var holder = document.createElement("div");
          holder.innerHTML = addSpec.slotHtml;
          slot = holder.firstElementChild;
          if (!slot) { return; }
          // Place before initialize() so the slot has real dimensions when
          // the widget's first resize() runs.
          applySlotPlacement(slot, slotPlacement);
          container.appendChild(slot);
          if (app.layoutMount) { app.layoutMount.injectFor(slot, entry); }
        }
        if (app.factory) { app.factory.addEntry(entry); app.factory.buildOne(entry); }
        if (slot && app.layoutMount) { app.layoutMount.observePlaceholder(slot); }
      }

      function softUpdate(msg) {
        if (msg.removeIds) {
          for (var ri = 0; ri < msg.removeIds.length; ri++) {
            softRemove(msg.removeIds[ri]);
          }
        }
        var slotsByInstance = {};
        if (msg.slots) {
          for (var si = 0; si < msg.slots.length; si++) {
            slotsByInstance[msg.slots[si].instanceId] = msg.slots[si];
          }
        }
        if (msg.addEntries) {
          for (var ai = 0; ai < msg.addEntries.length; ai++) {
            var spec = msg.addEntries[ai];
            softAdd(spec, slotsByInstance[spec.instanceId]);
          }
        }
        var container = document.getElementById("FWDLcontainer");
        if (container && msg.grid) {
          container.style.gridTemplateColumns = "repeat(" + msg.grid.cols + ", 1fr)";
          container.style.gridTemplateRows = "repeat(" + msg.grid.rows + ", 1fr)";
        }
        if (msg.slots) {
          for (var i = 0; i < msg.slots.length; i++) {
            var s = msg.slots[i];
            applySlotPlacement(document.querySelector('[data-widget="' + s.instanceId + '"]'), s);
          }
        }
        if (msg.buttons) {
          for (var j = 0; j < msg.buttons.length; j++) {
            var b = msg.buttons[j];
            var btn = document.getElementById(b.id);
            if (btn) { btn.style.display = b.visible ? "" : "none"; }
          }
        }
        // DataManager only dispatches on change, so a sample-mode preview
        // would otherwise leave new widgets at defaults forever.
        if (msg.addEntries && msg.addEntries.length && window.loadEvents) {
          window.dispatchEvent(window.loadEvents.clientRaw);
          window.dispatchEvent(window.loadEvents.clientRawExtra);
          window.dispatchEvent(window.loadEvents.clientRawDaily);
          window.dispatchEvent(window.loadEvents.clientRawHour);
          window.dispatchEvent(window.loadEvents.graphData);
        }
      }

      window.addEventListener("message", function (e) {
        var msg = e.data;
        if (!msg || typeof msg !== "object") return;
        if (msg.type === "render" && typeof msg.layoutJsSource === "string") {
          if (typeof msg.dataUrlPrefix === "string") {
            window.PREVIEW_DATA_URL_PREFIX = msg.dataUrlPrefix;
          }
          applyOverlayModeStyles(!!msg.overlayMode);
          applyLayout(msg.layoutJsSource);
        } else if (msg.type === "softUpdate") {
          softUpdate(msg);
        }
      });

      // Notify parent we're ready.
      window.parent && window.parent.postMessage({ type: "previewReady" }, "*");
    })();
  </script>
</body>
</html>
