{{- if .Values.operator.enabled }}
# 🔐 RBAC for the weather operator.
#
# Principle of least privilege: the operator may observe the weather, and
# update its status. It may not change the weather. (Yet. See ROADMAP.md.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-weather-operator
  labels:
    app.kubernetes.io/name: freshwdl-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-weather-operator
  labels:
    app.kubernetes.io/name: freshwdl-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    freshwdl.io/description: "Permission to look at the sky ☁️"
rules:
  - apiGroups: ["weather.freshwdl.io"]
    resources: ["weathers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["weather.freshwdl.io"]
    resources: ["weathers/status"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-weather-operator
  labels:
    app.kubernetes.io/name: freshwdl-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-weather-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-weather-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
