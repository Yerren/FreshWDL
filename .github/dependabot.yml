# 🤖 Dependabot: keeps our zero dependencies up to date.
version: 2
updates:
  # 🦀 Rust crates (there are none, but we are watching)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "rust"
      - "🦀"
    commit-message:
      prefix: "chore(deps)"

  # ⚙️ GitHub Actions (used by all 216 jobs)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # 🐳 Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
