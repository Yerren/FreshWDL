<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- OO conversion entry point. All widgets converted; WidgetsHandlers.js
             is no longer loaded. Data helpers live in DataHelpers.js; XHR
             polling and the CreateJS ticker are owned by App/DataManager. -->
        <link rel="stylesheet" type="text/css" href="css/stylesheet01.css" />
        <link href="css/opentip.min.css" rel="stylesheet" type="text/css" />
        <script type="text/javascript" src="UpperContent.js"></script>
        <meta http-equiv="Content-Script-Type" content="javascript" />
        <meta http-equiv="content-type" content="text/html; charset=UTF-8"/>
        <title>FreshWDL (OO)</title>
    </head>
    <body onload="initAll();">
        <script type="text/javascript" src="InnerContent.js"></script>

        <!-- Loading Screen -->
        <div id="loadingScreen">
            <div id="loadingText">
                <p id="titleText">Golden Bay Weather</p>
                <p id="loadingMessage">Collecting Data.</p>
            </div>
        </div>

        <script type="text/javascript" src="js_bundles/Loading.js"></script>

        <!-- Config + vendor libraries -->
        <script type="text/javascript" src="config.js"></script>
        <script type="text/javascript" src="js_bundles/easeljs-0.8.2.min.js"></script>
        <script type="text/javascript" src="js_bundles/tweenjs-0.6.2.min.js"></script>
        <script type="text/javascript" src="js_bundles/opentip-native.min.js"></script>
        <script type="text/javascript" src="js_bundles/moment-with-locales.min.js"></script>
        <script type="text/javascript" src="js_bundles/Chart.min.js"></script>
        <script type="text/javascript" src="js_bundles/Globals.js"></script>

        <!-- Data-processing helpers (Number/Array prototypes, getExtraInput,
             processGraphData, processRecordsData, formatTimestampsToMoments). -->
        <script type="text/javascript" src="js_bundles/DataHelpers.js"></script>

        <!-- Declarative data binding resolver. Must load before WidgetBase. -->
        <script type="text/javascript" src="js_bundles/DataBindings.js"></script>

        <!-- OO base hierarchy -->
        <script type="text/javascript" src="js_bundles/WidgetBase.js"></script>
        <script type="text/javascript" src="js_bundles/CanvasWidget.js"></script>
        <script type="text/javascript" src="js_bundles/DomHandler.js"></script>

        <!-- OO shape specialisations -->
        <script type="text/javascript" src="js_bundles/WidgetText.js"></script>
        <script type="text/javascript" src="js_bundles/WidgetBar.js"></script>
        <script type="text/javascript" src="js_bundles/WidgetGauge.js"></script>
        <script type="text/javascript" src="js_bundles/WidgetChart.js"></script>

        <!-- OO concrete widgets -->
        <script type="text/javascript" src="js_bundles/widgets/ApparentWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/SolarBarWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/HumidityGaugeWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/MainChartWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/TemperatureBarWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/BarometerWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/MoonSunWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/StatusWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/TitleRainfallWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/UniBarWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/UVBarWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/WindGaugeWidget.js"></script>
        <script type="text/javascript" src="js_bundles/widgets/WindSpeedWidget.js"></script>

        <!-- OO DOM handlers -->
        <script type="text/javascript" src="js_bundles/handlers/ForecastHandler.js"></script>
        <script type="text/javascript" src="js_bundles/handlers/RecordsHandler.js"></script>
        <script type="text/javascript" src="js_bundles/handlers/ModalGraphHandler.js"></script>
        <script type="text/javascript" src="js_bundles/handlers/ButtonsHandler.js"></script>
        <script type="text/javascript" src="js_bundles/handlers/ModalHandler.js"></script>

        <!-- OO infrastructure -->
        <script type="text/javascript" src="js_bundles/WidgetRegistry.js"></script>
        <script type="text/javascript" src="js_bundles/WidgetFactory.js"></script>
        <script type="text/javascript" src="js_bundles/DataManager.js"></script>
        <script type="text/javascript" src="js_bundles/LayoutMount.js"></script>
        <script type="text/javascript" src="js_bundles/App.js"></script>

        <script type="text/javascript">
            // Manifest: each entry binds a concrete constructor to its
            // widgetList/graphList enabled flag and canvas id. All widgets
            // are now converted; the only legacy code still running is
            // WidgetsHandlers.js for XHR polling, data helpers, and
            // initializeTicker().
            var manifest = [
                {
                    id: "apparent",
                    Ctor: ApparentWidget,
                    enabledKey: "apparent",
                    canvasID: "Apparent01",
                    config: {
                        canvasID: "Apparent01",
                        bindings: { temp: "clientraw[130]" }
                    }
                },
                {
                    id: "solar",
                    Ctor: SolarBarWidget,
                    enabledKey: "solar",
                    canvasID: "SolarBar01",
                    config: {
                        canvasID: "SolarBar01",
                        bindings: {
                            percent: "clientraw[34]",
                            watts:   "clientraw[127]",
                            sunHours: "clientrawExtra[696]"
                        }
                    }
                },
                {
                    id: "humidity",
                    Ctor: HumidityGaugeWidget,
                    enabledKey: "humidity",
                    canvasID: "HumidityGauge01",
                    config: {
                        canvasID: "HumidityGauge01",
                        bindings: {
                            humidity: "clientraw[5]",
                            trend:    "clientraw[144]"
                        }
                    }
                },
                {
                    id: "baroGraph",
                    Ctor: MainChartWidget,
                    enabledKey: "graphHandlerBarometer",
                    canvasID: "baroGraphCanvas01",
                    config: {
                        canvasID: "baroGraphCanvas01",
                        graphType: "line",
                        defaultBase: "barometer",
                        defaultRange: "hourlyDay"
                    }
                },
                {
                    id: "rainGraph",
                    Ctor: MainChartWidget,
                    enabledKey: "graphHandlerRainfall",
                    canvasID: "rainGraphCanvas01",
                    config: {
                        canvasID: "rainGraphCanvas01",
                        graphType: "bar",
                        defaultBase: "rainfallBar",
                        defaultRange: "dailyMonth"
                    }
                },
                {
                    id: "tempGraph",
                    Ctor: MainChartWidget,
                    enabledKey: "graphHandlerTemperature",
                    canvasID: "tempGraphCanvas01",
                    config: {
                        canvasID: "tempGraphCanvas01",
                        graphType: "line",
                        defaultBase: "temp",
                        defaultRange: "hourlyDay"
                    }
                },
                {
                    id: "windGraph",
                    Ctor: MainChartWidget,
                    enabledKey: "graphHandlerWindSpeed",
                    canvasID: "windGraphCanvas01",
                    config: {
                        canvasID: "windGraphCanvas01",
                        graphType: "line",
                        defaultBase: "windSpeed",
                        defaultRange: "hourlyDay"
                    }
                },
                {
                    id: "forecast",
                    Ctor: ForecastHandler,
                    enabledKey: "forecastHandler",
                    config: { elementId: "forecastText" }
                },
                {
                    id: "temperature",
                    Ctor: TemperatureBarWidget,
                    enabledKey: "temperature",
                    config: {
                        canvasID: "TempBar01",
                        widgetListKey: "temperature",
                        withArrow: true,
                        titleSuffix: "",
                        bindings: {
                            temp:  "clientraw[4]",
                            high:  "clientraw[46]",
                            low:   "clientraw[47]",
                            trend: "clientraw[143]"
                        }
                    }
                },
                {
                    id: "temperature02",
                    Ctor: TemperatureBarWidget,
                    enabledKey: "temperature02",
                    config: {
                        canvasID: "TempBar02",
                        widgetListKey: "temperature02",
                        withArrow: false,
                        titleSuffix: " 2",
                        bindings: {
                            temp: "widgetListInput:temperature02[0]",
                            high: "widgetListInput:temperature02[1]",
                            low:  "widgetListInput:temperature02[2]"
                        }
                    }
                },
                {
                    id: "temperature03",
                    Ctor: TemperatureBarWidget,
                    enabledKey: "temperature03",
                    config: {
                        canvasID: "TempBar03",
                        widgetListKey: "temperature03",
                        withArrow: false,
                        titleSuffix: " 3",
                        bindings: {
                            temp: "widgetListInput:temperature03[0]",
                            high: "widgetListInput:temperature03[1]",
                            low:  "widgetListInput:temperature03[2]"
                        }
                    }
                },
                {
                    id: "windChill",
                    Ctor: TemperatureBarWidget,
                    enabledKey: "windChill",
                    config: {
                        canvasID: "Windchill01",
                        widgetListKey: "windChill",
                        withArrow: false,
                        withAutoSwitch: true,
                        modeKey: "windChill",
                        titleSource: { mode: "dict", modeMap: { windchill: "windchillTitle", heatIndex: "heatIndexTitle" } },
                        tooltipSource: { mode: "dict", modeMap: { windchill: "windchillDescription", heatIndex: "heatIndexDescription" } },
                        // Conditional on widgetList.windChill.mode, so a function is the clearest form.
                        dataFn: function () {
                            var isWC = (widgetList.windChill.mode === "windchill");
                            return [
                                isWC ? arrayClientraw[44]  : arrayClientraw[112],
                                isWC ? arrayClientraw[77]  : arrayClientraw[110],
                                isWC ? arrayClientraw[78]  : arrayClientraw[111]
                            ];
                        },
                        autoSwitchBindings: {
                            realTemp: "clientraw[4]",
                            realMax:  "clientraw[47]",
                            realMin:  "clientraw[46]",
                            chillMax: "clientraw[78]",
                            chillMin: "clientraw[77]",
                            heatMax:  "clientraw[111]",
                            heatMin:  "clientraw[110]"
                        }
                    }
                },
                {
                    id: "barometer",
                    Ctor: BarometerWidget,
                    enabledKey: "barometer",
                    config: {
                        canvasID: "Barometer01",
                        bindings: {
                            pressure: "clientraw[6]",
                            trend:    "clientraw[50]"
                        }
                    }
                },
                {
                    id: "moonSun",
                    Ctor: MoonSunWidget,
                    enabledKey: "moonSun",
                    config: {
                        canvasID: "MoonSun01",
                        bindings: {
                            sunRise:   "clientrawExtra[556]",
                            sunSet:    "clientrawExtra[557]",
                            moonRise:  "clientrawExtra[558]",
                            moonSet:   "clientrawExtra[559]",
                            moonPhase: "clientrawExtra[560]",
                            moonAge:   "clientrawExtra[561]"
                        }
                    }
                },
                {
                    id: "status",
                    Ctor: StatusWidget,
                    enabledKey: "status",
                    config: {
                        canvasID: "Status01",
                        bindings: {
                            status:      "clientraw[49]",
                            stationTime: "clientraw[32]",
                            stationDate: "clientraw[74]"
                        }
                    }
                },
                {
                    id: "rainfallTitle",
                    Ctor: TitleRainfallWidget,
                    enabledKey: "rainfallTitle",
                    config: { canvasID: "TitleRainfall01" }
                },
                {
                    id: "rainfallDay",
                    Ctor: UniBarWidget,
                    enabledKey: "rainfallDay",
                    config: {
                        canvasID: "RainBar1",
                        title: useDict("rainfallDayTitle"),
                        bindings: { value: "clientraw[7]" }
                    }
                },
                {
                    id: "rainfallMonth",
                    Ctor: UniBarWidget,
                    enabledKey: "rainfallMonth",
                    config: {
                        canvasID: "RainBar2",
                        title: useDict("rainfallMonthTitle"),
                        bindings: { value: "clientraw[8]" }
                    }
                },
                {
                    id: "rainfallYear",
                    Ctor: UniBarWidget,
                    enabledKey: "rainfallYear",
                    config: {
                        canvasID: "RainBar3",
                        title: useDict("rainfallYearTitle"),
                        bindings: { value: "clientraw[9]" }
                    }
                },
                {
                    id: "UV",
                    Ctor: UVBarWidget,
                    enabledKey: "UV",
                    config: {
                        canvasID: "UVBar01",
                        bindings: { uv: "clientraw[79]" }
                    }
                },
                {
                    id: "windDirection",
                    Ctor: WindGaugeWidget,
                    enabledKey: "windDirection",
                    config: {
                        canvasID: "WindGauge01",
                        bindings: {
                            direction: "clientraw[3]",
                            avg:       "clientraw[117]"
                        }
                    }
                },
                {
                    id: "windSpeed",
                    Ctor: WindSpeedWidget,
                    enabledKey: "windSpeed",
                    config: {
                        canvasID: "WindSpeed01",
                        bindings: {
                            speed:    "clientraw[1]",
                            gust:     "clientraw[2]",
                            windHigh: "clientraw[113]",
                            gustHigh: "clientraw[71]"
                        }
                    }
                },
                {
                    id: "recordHandler",
                    Ctor: RecordsHandler,
                    enabledKey: "recordHandler",
                    config: {}
                },
                {
                    id: "modalGraph",
                    Ctor: ModalGraphHandler,
                    enabledKey: "graphHandler",
                    config: {}
                },
                {
                    id: "modalHandler",
                    Ctor: ModalHandler,
                    enabledKey: "modalHandler",
                    config: {}
                },
                {
                    id: "buttons",
                    Ctor: ButtonsHandler,
                    config: {}
                }
            ];

            window.app = new App({
                manifest: manifest,
                runDataManager: true,
                runTicker: true
            });

            // initAll is called by body onload. Prune disabled graph datasets,
            // then hand off to the OO App which builds all widgets and starts
            // the ticker and data-polling loop.
            window.initAll = function () {
                if (graphList["barometer"].enabled === false) { delete globalGraphs.barometer; }
                if (graphList["humidity"].enabled === false)  { delete globalGraphs.humidity; }
                if (graphList["solar"].enabled === false)     { delete globalGraphs.solar; }
                if (graphList["temp"].enabled === false)      { delete globalGraphs.temp; }
                if (graphList["uv"].enabled === false)        { delete globalGraphs.uv; }
                if (graphList["windDir"].enabled === false)   { delete globalGraphs.windDir; }
                if (graphList["windSpeed"].enabled === false) { delete globalGraphs.windSpeed; }
                if (graphList["rainfall"].enabled === false)  { delete globalGraphs.rainfallBar; delete globalGraphs.rainfallLine; }

                window.app.start();
            };
        </script>

        <a title="Web Statistics" href="http://clicky.com/100669726"><img alt="Web Statistics" src="//static.getclicky.com/media/links/badge.gif" border="0"></a>
        <script src="//static.getclicky.com/js" type="text/javascript"></script>
        <script type="text/javascript">try{ clicky.init(100669726); }catch(e){}</script>
        <noscript><p><img alt="Clicky" width="1" height="1" src="//in.getclicky.com/100669726ns.gif" /></p></noscript>
    </body>
</html>
