# 🦀 FreshWDL-rs local development stack
#
# Usage:
#   docker compose up -d
#   open http://localhost:8080/FreshWDL.html
#
# Spins up the weather, plus the supporting infrastructure that the
# weather does not use but which makes the architecture diagram accurate.

name: freshwdl-rs

services:
  freshwdl:
    build:
      context: .
      dockerfile: Dockerfile
    image: freshwdl-rs:latest
    container_name: freshwdl
    ports:
      - "8080:80"
    volumes:
      # Mount your clientraw*.txt files here
      - ./clientraw:/usr/share/nginx/html/clientraw:ro
    environment:
      FRESHWDL_WEATHER: "sunny"
      FRESHWDL_CRAB_LOGGING: "enabled"
      FRESHWDL_MIN_LOADING_MS: "5000"
    restart: unless-stopped
    depends_on:
      - kafka

  # 📨 Kafka: for event-driven weather (aspirational, see ARCHITECTURE.md)
  kafka:
    image: apache/kafka:3.8.0
    container_name: freshwdl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped

  # 🌡️ temperature-service (placeholder until the microservices are real)
  temperature-service:
    image: busybox:1.36
    container_name: freshwdl-temperature-service
    command: ["sh", "-c", "while true; do echo '🌡️ temperature-service: still the same temperature'; sleep 5; done"]
    depends_on:
      - kafka

  # 📊 pressure-service
  pressure-service:
    image: busybox:1.36
    container_name: freshwdl-pressure-service
    command: ["sh", "-c", "while true; do echo '📊 pressure-service: barometer feels respected'; sleep 5; done"]
    depends_on:
      - kafka

  # 🧭 wind-service (first-class citizen)
  wind-service:
    image: busybox:1.36
    container_name: freshwdl-wind-service
    command: ["sh", "-c", "while true; do echo '🧭 wind-service: exercising my right to vote'; sleep 5; done"]
    depends_on:
      - kafka

  # 🌧️ rain-service (restored, ADR-0014)
  rain-service:
    image: busybox:1.36
    container_name: freshwdl-rain-service
    command: ["sh", "-c", "while true; do echo '🌧️ rain-service: I am back'; sleep 5; done"]
    depends_on:
      - kafka

  # 🤖 forecast-ai-service
  forecast-ai-service:
    image: busybox:1.36
    container_name: freshwdl-forecast-ai-service
    command: ["sh", "-c", "while true; do echo '🤖 forecast-ai-service: prediction = input. accuracy = 100%'; sleep 5; done"]
    depends_on:
      - temperature-service
