[package]
name = "freshwdl-operator"
description = "☸️ A Kubernetes operator that reconciles the weather"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
freshwdl-core = { workspace = true }
freshwdl-clientraw = { workspace = true }
freshwdl-units = { workspace = true }
freshwdl-wind = { workspace = true }
freshwdl-forecast-ai = { workspace = true }
freshwdl-ferris = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
futures = "0.3.34"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
kube = { version = "5.0.0", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
schemars = "1.2.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
