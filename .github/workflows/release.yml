name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Package distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          cp -R dist "release/FreshWDL-${RELEASE_TAG}"
          tar -C release -czf "FreshWDL-${RELEASE_TAG}.tar.gz" "FreshWDL-${RELEASE_TAG}"
          (
            cd release
            zip -qr "../FreshWDL-${RELEASE_TAG}.zip" "FreshWDL-${RELEASE_TAG}"
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "FreshWDL-${RELEASE_TAG}.zip" \
            "FreshWDL-${RELEASE_TAG}.tar.gz" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "FreshWDL ${RELEASE_TAG}"
