apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-freshwdl
  labels:
    app.kubernetes.io/name: freshwdl
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    freshwdl.io/description: "Exposes the weather to the cluster 🌦️"
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: freshwdl
    app.kubernetes.io/instance: {{ .Release.Name }}
